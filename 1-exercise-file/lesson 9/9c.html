<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button onclick="showClick('heads')">heads</button>
  <button onclick="showClick('tails')">tails</button>

  <p class="js-display"></p>

  <script>

    function showClick (move) {
      document.querySelector('.js-display').innerText = `you choose: ${move}`
    }
  </script>

</body>
</html>
