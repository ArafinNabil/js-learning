<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
 
  <input type="text" placeholder="cost of order" class="js-input"  onkeyup=" eventListener(event)"> 

  <p class="js-display-text"></p>

<script>
  function eventListener(event) {
    document.querySelector('.js-display-text').innerHTML =  event.target.value;
  }
</script>

</body>
</html>
