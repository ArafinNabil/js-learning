<!DOCTYPE html>

<body>
  <script>

    function minMax(nums) {

      let maxValue = nums[0];
      let minValue = nums[0];

      if (nums.length === 0) {
        return { min:null , max: null };
      }

      for (let i = 0; i < nums.length; i++) {
        
        if (nums[i] > maxValue) {
          maxValue = nums[i]
        }
        if (nums[i] < minValue) {
          minValue = nums[i]
        }
      }
      return { min: minValue, max: maxValue };
    }

    console.log(minMax([]));
    console.log(minMax([-2, 3, -5, 7, 10]));

  </script>
</body>
</html>
