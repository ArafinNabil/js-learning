<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="12s.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button 
      class="move-button  js-rock-btn">
      <img src="../../2-main-exercise-file/images/rock-emoji.png" class="move-icon">
    </button>

    <button 
      class="move-button  js-paper-btn">
      <img src="../../2-main-exercise-file/images/paper-emoji.png" class="move-icon">
    </button>

    <button 
      class="move-button  js-scissors-btn">
      <img src="../../2-main-exercise-file/images/scissors-emoji.png" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');
      updateScoreElement();
    " class="reset-score-button">Reset Score</button>
  
    <button class="reset-score-button autoPlay-btn">Auto Play</button>

    <script src="scripts/12t.js"></script>
  </body>
</html>
