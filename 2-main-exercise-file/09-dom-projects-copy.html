<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <button class="js-subs-btn" onclick="subsFuns()">subscribe</button>
  <br><br><br>

  <p>calculate the cost of shipping</p>

  <input type="text" placeholder="cost of shipping" class="js-input-btn" onkeydown="eventListener(event)">

  <button class="js-calculate-btn" onclick="calculateTotal()">calculate</button>
  <p class="js-displyTotal"></p>


  <script>

    function subsFuns() {
      const btnElem = document.querySelector('.js-subs-btn')

      console.log(btnElem)

       btnElem.innerText === 'subscribe' 
        ? btnElem.innerHTML = 'subscribed' 
        : btnElem.innerHTML = 'subscribe'
       
      // if (btnElem.innerText === 'subscribe') {
      //   btnElem.innerHTML = 'subscribed'
      // }else {
      //   btnElem.innerHTML = 'subscribe'
      // }
    };

    function calculateTotal() {
      const inputBtnElem = document.querySelector('.js-input-btn').value
      let cost = Number(inputBtnElem);

      if (cost < 40 ) {
        cost += 10
      }

      const displayElem = document.querySelector('.js-displyTotal')
       .innerHTML = cost;
    }

    function eventListener(event) {
      if (event.key === 'Enter') {
        calculateTotal()
      }
    }
  </script>
