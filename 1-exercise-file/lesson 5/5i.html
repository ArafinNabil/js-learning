<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

  <button onclick="console.log(`cartQuantity is: ${cartQuantity}`);">
    show quantity
  </button>

  <button onclick="
    cartQuantity ++;
    console.log(`cartQuantity: ${cartQuantity}`);">
    Add to Cart
  </button>

  <button onclick="
    cartQuantity += 2;
    console.log(`cartQuantity: ${cartQuantity}`);"> +2</button>

  <button onclick="
    cartQuantity += 3;
    console.log(`cartQuantity: ${cartQuantity}`);"> +3</button>

  <button onclick="
    cartQuantity = 0;
    console.log(`${cartQuantity}`);">Reset Cart
  </button>

  <button onclick="
    cartQuantity += 4;
    console.log(`${cartQuantity}`);">+4
  </button>

  <button onclick="
    cartQuantity += 5;
    console.log(`${cartQuantity}`);">+5
  </button>

  <button onclick="
    cartQuantity --;
    console.log(`${cartQuantity}`);">remove from cart
  </button>

</body>

  <script>
    let cartQuantity = 0;
  </script>

</html>
