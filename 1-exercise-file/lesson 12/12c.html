<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <button onclick="startStop()" class="js-blink-btn">start</button>
  <script>

  function startStop() {
    let btnElem = document.querySelector('.js-blink-btn')
    setTimeout(function()  {
       btnElem.innerHTML = 'finished';
    }, 1000);
  }

  </script>
</body>
