<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button class="js-btn">Add to cart
  </button>

  <p class="js-display"></p>

  <script>
document.querySelector('.js-btn') 
 .addEventListener('click', () => {
    const btnElem = document.querySelector('.js-display')
    
      btnElem.textContent = 'added'
      setTimeout(() => {
        btnElem.innerHTML = '';
      }, 2000);
 }
);



  </script>
</body>
</html>
