<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
  <title>RPS game</title>
  
</head>
<body>

  <div class="game-card">
    <div class="title">NEON RPS</div>

    <div class="button-group">
      <button class="move-btn" onclick="playGame('rock')">✊</button>
      <button class="move-btn" onclick="playGame('paper')">✋</button>
      <button class="move-btn" onclick="playGame('scissors')">✌️</button>
    </div>

    <div class="result-text js-result"></div>
    <div class="moves-display js-moves">Pick a move to start</div>

    <div class="score-container">
      <div class="score-box">
        <span class="score-label">Wins</span>
        <span class="score-val js-wins">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Loses</span>
        <span class="score-val js-loses">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Ties</span>
        <span class="score-val js-ties">0</span>
      </div>
    </div>

    <button class="reset-link" onclick="resetScore()">Reset Game History</button>
  </div>
<script src="scripts/10-rock-paper-scissors.js"></script>
</body>
</html>
