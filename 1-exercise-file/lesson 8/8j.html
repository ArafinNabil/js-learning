<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button onclick="playWithguess('heads')">heads</button>
  <button onclick="playWithguess('tails')">tails</button>


  <script>
  let score = {
    wins:0,
    loses:0,
  }

  function playWithguess(guess)  {
    const randomNumber = Math.random() 
    
    let result = (randomNumber >= 0.5 ? 'heads':'tails');

    console.log(`result:${result}`)

 
    if (result === guess) {
      score.wins += 1;
    }else {
      score.loses += 1;
    }
    alert(`wins:${score.wins}loses:${score.loses}`)
  }
     
  </script>
</body>
</html>
