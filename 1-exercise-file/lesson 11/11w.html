<body>
  <script>
    function unique(array){
      let result = [];
      let seen = {}

      for (let i = 0; i < array.length; i++) {
        let current = array[i]

        if (!seem[current]) {
          result.push(current);
          seen[current] = true
        }
      }  
      return result;
    }
  console.log(unique(['green','red','blue','red']))
  </script>
