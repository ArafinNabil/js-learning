<style>
  .btn {
    padding: 12px 20px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    background: #4f46e5;
    color: white;
    cursor: pointer;

    /* BIG TECH TIMINGS */
    transition:
      transform 120ms ease,
      background 200ms ease,
      opacity 150ms ease;
  }

  .btn:active {
    transform: scale(0.96); /* instant feedback */
  }

  .btn.loading {
    opacity: 0.7;
    pointer-events: none;
  }
</style>
<body>
  <button class="js-btn btn">click</button>

<script>

  const btnElem = document.querySelector('.js-btn');
  btnElem.addEventListener('click', () => {

      btnElem.innerText = 'done'
    }, 120)
