<body>
  <script>
    function minMax(nums) {
      let maxValue = nums[0];
      let minValue = nums[0];

      for (let i = 0; i < nums.length; i++) {
        if (nums[i] > maxValue) {
          maxValue = nums[i]
        }
        if (nums[i] < minValue) {
          minValue = nums[i]
        }
      }
          return { min: minValue, max: maxValue };
    }

    console.log(minMax([1, -3, 5]));
    console.log(minMax([-2, 3, -5, 7, 10]));
  </script>
</body>
