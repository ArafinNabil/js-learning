<body>
  <script>
    function convertTempereature(degrees, unit) {
      if (unit === 'f') {
        console.log((degrees -32)*5/9 + 'c');
      }else if (unit === 'c') {
        console.log((degrees *9/5 +32)+'f');
      }
      
    }
    convertTempereature(86, 'f') ;
  </script>
</body>
