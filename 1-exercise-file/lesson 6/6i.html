<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const randomNumber = Math.random()

    let result;
    const guess = 'tails';

    if (randomNumber >= 0.5) {    
      result = 'heads';
    }
    else {
      result = 'tails';  
    }
    console.log(result);
    if (result === guess) {
      console.log('you win');
    } else {
      console.log('you loose');
    }
    
  </script>
</body>
</html>
