<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input type="text" placeholder="enter your name" class="js-input" onkeydown="eventListen(event)">
  <button class="js-sumbit-btn" onclick="submit()">sumbit</button>

  <p class="js-display"></p>
  <script>
    function eventListen(event) {
      if (event.key === 'Enter') {
        submit()
      }
       
    }
    function submit() {
      let text = document.querySelector('.js-input').value
      document.querySelector('.js-display').innerText = `your name is: ${text}`
    }
  </script>
  
</body>
</html>
