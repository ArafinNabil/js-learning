<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .subs-btn {
      color: #fff;
      background-color: black;
      padding: 10px 15px 10px 15px;
      border-radius: 50px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .is-subscribed {
      background-color: rgb(240, 240, 240);
      color: black;
    }
  </style>
</head>
<body>
  <p>youtube subscribe button</p>

  <button class="js-subs-btn subs-btn" onclick="subsBtn()">subscribe</button>

  <br><br><br><br><br>


  <p>Amazon Shipping Calculator</p>
  <p>orders under $40 has to pay $10 shipping</p>
  <p>order over $40 free shipping </p>

  <input type="text" placeholder="cost of order" class="costOrderInput"  onkeydown="eventListener(event)"> 
  <button class=".js-calculate-btn" onclick="costCalculate()" >calculate</button>

  <div class="js-disply-cost"></div>

  <script>

    function subsBtn() {
      const btnElem = document.querySelector('.js-subs-btn')

      if (btnElem.innerText === 'subscribe') {
        btnElem.innerHTML = 'subscribed';
        btnElem.classList.add('is-subscribed')
      }
      else {
        btnElem.innerHTML = 'subscribe';      
      }
    };

    function eventListener(event) {
      if (event.key === 'Enter') {
        costCalculate();

      };
    };

    function costCalculate() {
      const inputElem = document.querySelector('.costOrderInput');
      let cost = Number(inputElem.value);

      if (cost < 40) {
        cost += 10;
      }

      displyElem = document.querySelector('.js-disply-cost')
       .innerHTML = cost
    };

  </script>
</body>
</html>
