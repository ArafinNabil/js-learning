<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
</head>
<body>

<p>
  <button onclick="updateCalculation('1');">1</button>

  <button onclick="updateCalculation('2');">2</button>

  <button onclick="updateCalculation('3');">3</button>

  <button onclick="updateCalculation(' + ');">+</button>
</p>


<p>
  <button onclick="updateCalculation('4');">4</button>
  <button onclick="updateCalculation('5');">5</button>
  <button onclick="updateCalculation('6');">6</button>
  <button onclick="updateCalculation('-');">-</button>
</p>


<p>
  <button onclick="
    calculation += '7'; console.log(calculation);">7
  </button>

  <button onclick="
    calculation += '8'; console.log(calculation);">8
  </button>

  <button onclick="
    calculation += '9'; console.log(calculation);">9
  </button>

  <button onclick="
    calculation += ' * '; console.log(calculation);">*
  </button>
</p>

<p>
  <button onclick="
    calculation += '0';console.log(calculation);">0
  </button>

  <button onclick="
    calculation += '.';console.log(calculation);">.
  </button>

  <button onclick="
    calculation += ' / ';console.log(calculation);">/
  </button>

  <button onclick="
    calculation = eval(calculation);console.log(calculation);">=
  </button>


</p>

<p>
  <button onclick="
    calculation = '';
    console.log('Cleared.');
  ">Clear</button>
</p>




</body>

  <script>
    let calculation = '';
    function updateCalculation(value) {
      calculation += value;
      console.log(calculation);
    }

  </script>

</html>
