<body>
  <script>

function countWords(words) {
  const counts = {};

  for (let i = 0; i < words.length; i++) {
    const word = words[i];

    if (counts[word] !== undefined) {
      counts[word] += 1;
    } 
    else {
      counts[word] = 1;
    }
  }

  return counts;
}
    console.log(countWords(['apple', 'grape', 'apple', 'apple']));

  </script>
</body>
