<body>
  <button onclick="playWithguess('heads')">heads</button>
  <button onclick="playWithguess('tails')">tails</button>
  <script>
  
  function playWithguess()  {
    const randomNumber = Math.random() 
    
    let result;
    console.log(result = (randomNumber >= 0.5 ? 'heads':'tails'));

    const guess = 'tails';
    console.log(result === guess ? 'you win' : 'you lose');
  }
    
    

   
    
  </script>
</body>
