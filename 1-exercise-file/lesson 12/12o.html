<script>
  function removeEggs(foods) {
    let eggsRemoved = 0;

    let result = foods.filter((value) => {
      if (value === 'egg' && eggsRemoved < 2) {
        eggsRemoved++;
        return false;
      }
      else {
        return true;
      }
    });
    return result;
  }

  // function removeEggs(foods) {

  console.log(removeEggs(['egg','apple','egg','egg','ham']));

</script>
